<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        width: 340px;
        margin: 0;
        font-family: -apple-system, "PingFang SC", sans-serif;
        font-size: 13px;
        color: #1e293b;
        background: #f8fafc;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        background: linear-gradient(135deg, #6366f1, #06b6d4);
        color: #fff;
        font-weight: 600;
      }
      header .logo {
        width: 22px; height: 22px; border-radius: 6px;
        background: rgba(255,255,255,.2);
        display: flex; align-items: center; justify-content: center;
        font-size: 11px;
      }
      section { padding: 10px 12px; }
      label { display: block; margin: 8px 0 3px; font-size: 11px; color: #64748b; }
      input, textarea, select {
        width: 100%; box-sizing: border-box;
        padding: 6px 8px; border: 1px solid #e2e8f0; border-radius: 6px;
        font-size: 12px; font-family: inherit; background: #fff;
      }
      textarea { height: 84px; resize: vertical; }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      button.primary {
        margin-top: 12px; width: 100%; padding: 8px;
        background: #4f46e5; color: #fff; border: 0; border-radius: 8px;
        font-size: 13px; font-weight: 500; cursor: pointer;
      }
      button.primary:disabled { background: #a5b4fc; cursor: default; }
      .msg { margin-top: 8px; padding: 6px 8px; border-radius: 6px; font-size: 12px; }
      .msg.ok { background: #d1fae5; color: #065f46; }
      .msg.err { background: #fee2e2; color: #991b1b; }
      .settings-toggle {
        margin-top: 10px; font-size: 11px; color: #6366f1;
        cursor: pointer; user-select: none; text-align: center;
      }
      .hint { font-size: 11px; color: #94a3b8; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
