[workspace]
resolver = "2"
members = ["crates/core", "crates/http"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "migrate", "macros"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
base64 = "0.22"

[package]
name = "find-your-job"
version = "0.1.0"
description = "FindYourJob — 求职投递记录与面试复盘（macOS）"
edition = "2021"

[lib]
name = "find_your_job_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
fyj-core = { path = "crates/core" }
fyj-http = { path = "crates/http" }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
