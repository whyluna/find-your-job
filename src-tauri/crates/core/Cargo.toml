[package]
name = "fyj-core"
version = "0.1.0"
description = "FindYourJob 领域层：模型、状态机、服务、仓储（纯 Rust，不依赖 Tauri）"
edition = "2021"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
base64 = { workspace = true }
url = "2"
mailparse = "0.15"
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tempfile = "3"
